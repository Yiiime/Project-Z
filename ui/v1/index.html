          <span class="screen-status" id="screen-status" hidden></span>
        </div>

        <section class="image-stage" id="image-stage" aria-label="界面示意图" tabindex="-1" aria-busy="true">
          <button class="image-button" id="image-button" type="button" aria-label="放大当前界面示意图" hidden>
            <img id="screen-image" alt="" draggable="false" />
            <span class="image-hint">点击放大 <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4H4v4M16 4h4v4M4 16v4h4M20 16v4h-4"/></svg></span>
          </button>
          <div class="stage-message" id="stage-message" role="status">
            <span class="message-mark" aria-hidden="true">Z</span>
            <h3 id="stage-message-title">正在载入界面目录</h3>
            <p id="stage-message-text">读取同目录的 manifest.json。</p>
            <div class="message-actions">
              <button class="text-button" id="retry-button" type="button" hidden>重新载入</button>
              <button class="primary-button" id="manifest-button" type="button" hidden>选择 manifest.json</button>
            </div>
            <input type="file" id="manifest-input" accept=".json,application/json" hidden />
          </div>
        </section>

        <section class="action-strip" id="action-strip" aria-labelledby="action-label" hidden>
          <span class="action-label" id="action-label">界面导览<span>页面跳转</span></span>
          <div class="screen-actions" id="screen-actions"></div>
        </section>

        <footer class="viewer-controls" aria-label="界面浏览控制">
          <div class="paging-controls">
            <button class="control-button" id="previous-button" type="button" aria-label="上一张界面" title="上一张 · ←" disabled><span aria-hidden="true">←</span><span class="control-label">上一张</span></button>
            <span class="page-count utility" id="page-count" aria-live="off">— / —</span>
            <button class="control-button" id="next-button" type="button" aria-label="下一张界面" title="下一张 · → 或空格" disabled><span class="control-label">下一张</span><span aria-hidden="true">→</span></button>
          </div>
          <span class="keyboard-hint">← → 浏览 <span>·</span> 空格下一张</span>
          <div class="display-controls">
            <button class="control-button" id="fullscreen-button" type="button" aria-label="进入全屏" aria-pressed="false" title="进入全屏"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4H4v4M16 4h4v4M4 16v4h4M20 16v4h-4"/></svg><span id="fullscreen-label">全屏</span></button>
            <button class="control-button" id="details-toggle" type="button" aria-expanded="false" aria-controls="details-sidebar"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 11v6M12 7v1"/></svg><span id="details-toggle-label">显示说明</span></button>
          </div>
        </footer>
      </main>

      <aside class="details-sidebar" id="details-sidebar" aria-labelledby="details-heading" hidden>
        <div class="sidebar-heading"><h2 id="details-heading">当前界面说明</h2><button class="icon-button small-button" id="details-close" type="button" aria-label="关闭说明">×</button></div>
        <div class="details-content" id="details-content">
          <section class="detail-section"><h3>玩家目标</h3><p id="screen-goal">载入目录后显示。</p></section>
          <section class="detail-section"><h3>画面内容</h3><p id="screen-summary">载入目录后显示。</p></section>
          <section class="detail-section" id="notes-section" hidden><h3>设计说明</h3><ul id="screen-notes"></ul></section>
        </div>
        <p class="detail-disclaimer">这里展示静态 UI 示意图。导览按钮用于查看页面关系，图中操作、数值与对话未接入游戏逻辑。</p>
      </aside>
    </div>

    <dialog class="image-dialog" id="image-dialog" aria-label="放大查看界面示意图">
      <div class="zoom-heading"><p id="zoom-title">界面示意图</p><button class="control-button" id="zoom-close" type="button"><span>退出放大</span><kbd>Esc</kbd></button></div>
      <div class="zoom-image-area"><img id="zoom-image" alt="" draggable="false" /></div>
      <p class="zoom-caption">完整画面 · UI 示意，非实机运行</p>
    </dialog>
    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
    <div class="sr-only" id="screen-announcement" aria-live="polite" aria-atomic="true"></div>
    <noscript><div class="noscript-message">界面导览需要 JavaScript。请启用 JavaScript 后重新打开；原始示意图仍可在 assets 文件夹中查看。</div></noscript>
  </body>
</html>
