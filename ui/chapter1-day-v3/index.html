  <script>
  (() => {
    'use strict';
    const manifest = JSON.parse(document.getElementById('embedded-manifest').textContent);
    const screens = manifest.screens;
    const $ = selector => document.querySelector(selector);
    const copy = {
      zh: {project:'来自月亮的 Z',subtitle:'第一章 · 白天设定与昼夜衔接',englishExample:'查看英文示例',overview:'打开总览 ↗',screenList:'设定图 / 10',switchImage:'切换图片',map:'地图',backpack:'背包',shortcutContext:'快捷键仅用于审图导航。',nightLink:'夜间风格对照',nightFooter:'夜间风格对照',artworkLabel:'中文设定图',original:'打开原图 ↗',download:'下载 JPG',languageNote:'中英切换仅更改导览文字；图内文字以中文为主，英文只提供部分示例。',boundary:'静态设定图 · 非可玩引擎。图中控件不执行游戏行动或 AI 对话。',language:'导览语言',navigation:'设定图导航',previous:'上一张',next:'下一张',loading:'正在载入图片',unavailable:'图片暂未载入',unavailableDetail:'导出文件可能尚未生成，或已被移动。请检查下列本地路径。'},
      en: {project:'Z, from the Moon',subtitle:'Chapter 1 · Daytime studies and the night transition',englishExample:'View English example',overview:'Open overview ↗',screenList:'STUDIES / 10',switchImage:'Switch image',map:'Map',backpack:'Backpack',shortcutContext:'These shortcuts navigate the review only.',nightLink:'Nighttime style reference',nightFooter:'Nighttime style reference',artworkLabel:'Chinese artwork',original:'Open original ↗',download:'Download JPG',languageNote:'Language switching changes this guide only. Most artwork is in Chinese; selected English examples are provided separately.',boundary:'Static studies · Not a playable engine. Controls inside the images do not run game actions or AI dialogue.',language:'Guide language',navigation:'Study navigation',previous:'Previous image',next:'Next image',loading:'Loading image',unavailable:'Image is not available yet',unavailableDetail:'The export may not have been created, or may have moved. Check the local path below.'}
    };
    let locale = new URLSearchParams(location.search).get('lang') === 'en' ? 'en' : 'zh';
    let active = 0, loadSequence = 0, loadState = 'loading';
    const t = key => copy[locale][key];
    const field = (screen, key) => screen[locale === 'en' ? key + 'En' : key];
    const number = n => String(n + 1).padStart(2, '0');

    function renderLanguage() {
      document.documentElement.lang = locale === 'en' ? 'en' : 'zh-CN';
      document.title = locale === 'en' ? manifest.titleEn : manifest.title;
      document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
      document.querySelectorAll('[data-locale]').forEach(el => el.setAttribute('aria-pressed', String(el.dataset.locale === locale)));
      $('#language-group').setAttribute('aria-label', t('language'));
      $('#navigation').setAttribute('aria-label', t('navigation'));
      $('#previous').setAttribute('aria-label', t('previous'));
      $('#next').setAttribute('aria-label', t('next'));
      $('#english-example').href = manifest.englishExample.file;
      $('#navigation').replaceChildren(...screens.map((screen, index) => {
        const link = document.createElement('a');
        link.className = 'screen-link'; link.href = '#' + screen.id;
        const ordinal = document.createElement('span'); ordinal.className = 'screen-number'; ordinal.textContent = number(index);
        const label = document.createElement('span'); label.textContent = field(screen, 'title');
        link.append(ordinal, label); return link;
      }));
      renderDetails();
    }

    function renderDetails() {
      const screen = screens[active];
      $('#image-title').textContent = field(screen, 'title');
      $('#purpose').textContent = field(screen, 'purpose');
      $('#artwork').alt = field(screen, 'alt');
      $('#counter').textContent = number(active) + ' / ' + screens.length;
      $('#previous').disabled = active === 0;
      $('#next').disabled = active === screens.length - 1;
      $('#original').href = screen.file; $('#download').href = screen.file;
      $('#download').download = screen.id + '.jpg';
      document.querySelectorAll('.screen-link').forEach((link, index) => {
        if (index === active) link.setAttribute('aria-current', 'page');
        else link.removeAttribute('aria-current');
      });
      $('#status-title').textContent = t(loadState === 'error' ? 'unavailable' : 'loading');
      $('#status-detail').textContent = loadState === 'error' ? t('unavailableDetail') : '';
      $('#status-path').textContent = screen.file;
      $('#announcement').textContent = number(active) + ' / ' + screens.length + ' · ' + field(screen, 'title');
    }

    function loadScreen(index) {
      active = index;
      const screen = screens[active], request = ++loadSequence;
      loadState = 'loading';
      $('#artwork').hidden = true; $('#image-status').hidden = false;
      $('#dimensions').textContent = '';
      $('#image-stage').setAttribute('aria-busy', 'true');
      renderDetails();
      const image = new Image();
      image.id = 'artwork'; image.alt = field(screen, 'alt');
      image.onload = () => {
        if (request !== loadSequence) return;
        loadState = 'ready'; image.alt = field(screen, 'alt');
        $('#artwork').replaceWith(image);
        $('#image-status').hidden = true;
        $('#dimensions').textContent = image.naturalWidth + ' × ' + image.naturalHeight;
        $('#image-stage').setAttribute('aria-busy', 'false');
      };
      image.onerror = () => {
        if (request !== loadSequence) return;
        loadState = 'error'; $('#image-stage').setAttribute('aria-busy', 'false'); renderDetails();
      };
      image.src = screen.file;
    }

    function readRoute() {
      let id = '';
      try { id = decodeURIComponent(location.hash.slice(1)); } catch (_) { /* Fall back to the first study. */ }
      const index = screens.findIndex(screen => screen.id === id);
      if (index < 0) {
        history.replaceState(null, '', location.pathname + location.search + '#' + screens[0].id);
        loadScreen(0);
      } else loadScreen(index);
    }

    function go(index) {
      if (index < 0 || index >= screens.length || index === active) return;
      location.hash = screens[index].id;
    }

    $('#previous').addEventListener('click', () => go(active - 1));
    $('#next').addEventListener('click', () => go(active + 1));
    document.querySelectorAll('[data-locale]').forEach(button => button.addEventListener('click', () => {
      locale = button.dataset.locale;
      const query = new URLSearchParams(location.search);
      if (locale === 'en') query.set('lang', 'en'); else query.delete('lang');
      history.replaceState(null, '', location.pathname + (query.size ? '?' + query.toString() : '') + location.hash);
      renderLanguage();
    }));
    window.addEventListener('hashchange', readRoute);
    document.addEventListener('keydown', event => {
      if (event.defaultPrevented || event.altKey || event.ctrlKey || event.metaKey || event.shiftKey || event.isComposing) return;
      if (event.target.closest('input,textarea,select,[contenteditable="true"]')) return;
      if (event.key === 'ArrowLeft') { event.preventDefault(); go(active - 1); }
      else if (event.key === 'ArrowRight') { event.preventDefault(); go(active + 1); }
      else if (event.key.toLowerCase() === 'm') { event.preventDefault(); go(screens.findIndex(screen => screen.id === '02-map')); }
      else if (event.key.toLowerCase() === 'i') { event.preventDefault(); go(screens.findIndex(screen => screen.id === '09-backpack')); }
    });
    renderLanguage();
    readRoute();
  })();
  </script>
