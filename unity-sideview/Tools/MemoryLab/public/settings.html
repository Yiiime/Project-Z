<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>岛民记忆 · 模型连接</title><link rel="stylesheet" href="/settings.css"></head><body><main>
<p class="eyebrow">PROJECT Z · MEMORY LAB</p><h1>让岛民开始交谈</h1><p>配置保存在这台电脑上。游戏中的十位 NPC 会使用各自的人设与记忆，分别生成台词。</p><p><a href="/memories">查看十名 NPC 的记忆 →</a></p>
<form id="config"><label>模型服务<select name="provider"><option value="ark">火山方舟／豆包</option><option value="deepseek">DeepSeek</option></select></label><label>Base URL<input name="baseUrl" type="url" required autocomplete="off"></label><label>Model／接入点 ID<input name="model" required autocomplete="off" placeholder="模型 ID 或 ep-…"></label><label>API Key<input name="apiKey" type="password" autocomplete="new-password" placeholder="输入密钥；已有配置时留空可沿用"></label><label>接口<select name="apiType"><option value="chat">Chat Completions</option><option value="responses">Responses（方舟）</option></select></label><label class="check"><input name="jsonMode" type="checkbox" checked>使用模型 JSON 输出</label><label class="check"><input name="disableThinking" type="checkbox" checked>关闭深度思考以缩短等待</label><div class="actions"><button>保存配置</button><button type="button" id="test">测试连接</button></div></form>
<p id="status" role="status">正在检查服务…</p><p class="note">密钥不显示在状态中、不写入游戏存档或日志。保存后可返回 Unity，NPC 会在连接可用时自动开始活动。没有配置时仍可探索小岛。</p>
</main><script src="/settings.js"></script></body></html>
