<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>岛民记忆 · 模型连接</title><link rel="stylesheet" href="/settings.css"></head><body><main>
<p class="eyebrow">PROJECT Z · MEMORY LAB</p><h1>让岛民开始交谈</h1><p id="intro">正在检查对话连接。</p><p><a href="/memories">查看 NPC 的记忆 →</a></p>
<section id="team" hidden><p>使用拥有项目权限的 GitHub 账号登录，即可使用团队提供的模型。</p><p id="team-account"></p><div class="actions"><button type="button" id="team-login">用 GitHub 连接</button><button type="button" id="team-test">测试连接</button><button type="button" id="team-logout">退出登录</button></div><div id="team-code" hidden><p>在 GitHub 输入这次登录代码：</p><strong id="login-code"></strong><p><a id="github-link" href="https://github.com/login/device" target="_blank" rel="noopener noreferrer">打开 GitHub 授权页 →</a></p></div></section>
<form id="config" hidden><label>模型服务<select name="provider"><option value="ark">火山方舟／豆包</option><option value="deepseek">DeepSeek</option></select></label><label>Base URL<input name="baseUrl" type="url" required autocomplete="off"></label><label>Model／接入点 ID<input name="model" required autocomplete="off" placeholder="模型 ID 或 ep-…"></label><label>API Key<input name="apiKey" type="password" autocomplete="new-password" placeholder="输入密钥；已有配置时留空可沿用"></label><label>接口<select name="apiType"><option value="chat">Chat Completions</option><option value="responses">Responses（方舟）</option></select></label><label class="check"><input name="jsonMode" type="checkbox" checked>使用模型 JSON 输出</label><label class="check"><input name="disableThinking" type="checkbox" checked>关闭深度思考以缩短等待</label><div class="actions"><button>保存配置</button><button type="button" id="test">测试连接</button></div></form>
<p id="status" role="status">正在检查服务…</p><p class="note" id="connection-note">连接完成后可返回 Unity，NPC 会使用各自的人设与记忆生成台词。没有连接时仍可探索小岛。</p>
</main><script src="/settings.js"></script></body></html>
