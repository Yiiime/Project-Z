<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>上传故事文件 · Project Z</title><link rel="stylesheet" href="/app.css"></head>
<body class="editor-page"><header class="top"><a class="brand" href="/">PROJECT Z <span>结局创作台</span></a><nav><a class="quiet" href="/">返回码头 ↗</a></nav></header>
<main class="file-main"><span class="small-label">ONE FILE, ALL THESE DAYS</span><h1>把故事，带到这个夜晚。</h1><p class="file-intro">上传一份本地文件，写着玩家与 Z 的记忆、岛上的剧情和最后的处境。<br>不需要逐项填表，也不需要特定模板。</p>
<label id="drop-zone" class="drop-zone"><input id="story-file" type="file" accept=".txt,.md,.json,text/plain,text/markdown,application/json"><span class="file-symbol">↥</span><strong>选择故事文件</strong><span>或把文件拖到这里</span><small>TXT · Markdown · JSON　／　文本最多 60,000 字</small></label>
<p id="notice" role="status" class="notice"></p><p id="error" role="alert" class="error"></p>
<section id="import-preview" class="file-preview" hidden><div class="file-preview-head"><div><span class="small-label">READY FOR THE LAST NIGHT</span><h2 id="preview-title"></h2><p id="preview-count"></p></div><button id="use-file" class="primary">使用这份文件 →</button></div><p id="preview-context"></p><details><summary>查看整理出的经历</summary><div id="preview-memories"></div></details><p class="field-hint">原文完整保留。标记为 Z 未知的幕后内容不会进入她的结局回望。</p></section>
<section class="current-file"><span class="small-label">当前这一局</span><p id="current-file">正在读取</p><button id="export" class="text-button">下载当前经历 JSON ↓</button></section>
<details class="connection-details"><summary id="connection-summary">模型连接</summary><p class="field-hint">沿用已有模型连接；没有连接时在这里设置一次即可。密钥只保存在本机。</p><div class="form-grid"><label>服务商<select id="provider"><option value="deepseek">DeepSeek</option><option value="ark">火山方舟</option></select></label><label>接口类型<select id="apiType"><option value="chat">Chat Completions</option><option value="responses">Responses（方舟）</option></select></label><label>Base URL<input id="baseUrl" autocomplete="off"></label><label>Model ID<input id="model" autocomplete="off"></label><label class="wide">API Key<input id="apiKey" type="password" autocomplete="off" placeholder="已保存时可留空"></label></div><div class="model-actions"><button id="save-model" class="secondary">保存连接</button><span id="model-status"></span></div></details>
</main><script type="module" src="/editor.js"></script></body></html>
